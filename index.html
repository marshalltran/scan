<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b1918">
<title>Quét mã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --spx:#EE4D2D; --bg:#1b1918; --panel:#262321; --line:#3a3532; --text:#f4efed; --muted:#a39b97; --ok:#34d399; --bad:#ff8fa3; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { min-height:100%; max-width:460px; margin:0 auto; padding:max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }

  header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .badge { width:34px; height:34px; border-radius:10px; background:var(--spx); display:grid; place-items:center; flex-shrink:0; }
  .badge svg { width:20px; height:20px; }
  .brand b { display:block; font-size:16px; font-weight:800; line-height:1.2; }
  .brand small { display:block; font-size:12px; color:var(--muted); font-weight:600; }
  .icon { width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text); display:grid; place-items:center; cursor:pointer; flex-shrink:0; transition:transform .08s, background .15s; }
  .icon:active { transform:scale(.94); }
  .icon svg { width:22px; height:22px; }
  .icon.on { background:var(--spx); border-color:var(--spx); }

  .stage { position:relative; border-radius:20px; overflow:hidden; background:#000; border:1px solid var(--line); isolation:isolate; contain:paint; }
  #reader { width:100%; height:100%; border:0 !important; }
  #reader video { display:block; width:100% !important; height:100% !important; object-fit:cover; }
  .stage { height:calc(100vh - 215px); height:calc(100dvh - 215px); min-height:200px; }
  .bar { display:flex; align-items:center; gap:8px; }
  .bar .status { flex:1; min-width:0; padding:6px 10px; font-size:13px; }
  .bar .tools { flex-shrink:0; gap:6px; flex-wrap:nowrap; }
  .bar .icon { width:42px; height:42px; }
  #qr-shaded-region { display:none !important; }

  .frame { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:14px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); pointer-events:none; width:70%; height:45%; }
  .c { position:absolute; width:26px; height:26px; border:4px solid var(--spx); transition:border-color .2s; }
  .tl { left:-2px; top:-2px; border-right:0; border-bottom:0; border-radius:14px 0 0 0; }
  .tr { right:-2px; top:-2px; border-left:0; border-bottom:0; border-radius:0 14px 0 0; }
  .bl { left:-2px; bottom:-2px; border-right:0; border-top:0; border-radius:0 0 0 14px; }
  .br { right:-2px; bottom:-2px; border-left:0; border-top:0; border-radius:0 0 14px 0; }
  .check { position:absolute; inset:0; display:none; place-items:center; }
  .check svg { width:64px; height:64px; padding:14px; border-radius:50%; background:var(--ok); color:#06281c; animation:pop .28s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }
  .frame.done .c { border-color:var(--ok); }
    .frame.done .check { display:grid; }

  .status { display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:8px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--line); font-size:14px; font-weight:600; color:var(--text); text-align:center; }
  .status.bad { color:var(--bad); border-color:#5a2a35; }
  .status.ok { color:var(--ok); border-color:#1f5c47; }
  #result { text-align:center; font-size:26px; font-weight:800; letter-spacing:.05em; word-break:break-all; min-height:34px; }
  .tools { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .pill { min-height:46px; padding:0 22px; border-radius:23px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:700 14px "Be Vietnam Pro", sans-serif; cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .check svg { animation:none; } }
  /* Quét liên tục */
  .multi .stage { height:calc(100vh - 360px); height:calc(100dvh - 360px); }
  .mbox { display:flex; flex-direction:column; gap:8px; }
  .mhead { display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--muted); }
  .mhead b { color:var(--text); font-size:15px; }
  .mlist { display:flex; flex-wrap:wrap; gap:6px; max-height:64px; overflow-y:auto; }
  .mlist span { font:700 13px ui-monospace, Menlo, monospace; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 8px; }
  .mlist span:first-child { border-color:var(--ok); color:var(--ok); }
  .btn-done { min-height:52px; border:0; border-radius:14px; background:var(--spx); color:#fff; font:800 16px "Be Vietnam Pro", sans-serif; cursor:pointer; }
  .btn-done:disabled { opacity:.45; }
  .snd { border:1px dashed var(--line); background:transparent; color:var(--muted); border-radius:10px; font:600 12px "Be Vietnam Pro", sans-serif; padding:6px 10px; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/></svg></span>
      <div><b id="title">Quét mã</b><small>HCM Mega SOC</small></div>
    </div>
    <button class="icon" id="btnClose" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>

  <div class="stage">
    <div id="reader"></div>
    <div class="frame" id="frame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    </div>
  </div>

  <div class="bar">
    <div class="status" id="msg" role="status" aria-live="polite">Đang mở camera...</div>
    <div class="tools">
    <button class="icon" id="btnZoom" hidden aria-label="Phóng to" style="font:800 14px 'Be Vietnam Pro',sans-serif">1x</button>
    <button class="icon" id="btnTorch" hidden aria-label="Bật đèn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L5 14h5l-1 8 8-12h-5z"/></svg></button>
    <button class="icon" id="btnFlip" hidden aria-label="Đổi camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13l-3-3M21 17H8l3 3"/></svg></button>
  </div>
  </div>
  <div class="mbox" id="mbox" hidden>
    <div class="mhead"><span>Đã quét <b id="cnt">0</b></span><button class="snd" id="btnSnd" hidden>Chạm để bật tiếng bíp</button></div>
    <div class="mlist" id="mlist"></div>
    <button class="btn-done" id="btnDone" disabled>Xong</button>
  </div>
  <div id="result"></div>
  <div style="text-align:center"><button class="pill" id="btnCopy" hidden>Sao chép mã</button></div>

</div>

<script>
  var LIBS = [
    'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js',
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'
  ];
  var TITLES = { stationEmp: 'Quét mã OPS / nhân viên', stationBorrow: 'Quét mã tài sản', pdaHistory: 'Quét để xem lịch sử', trSn: 'Quét SN vào phiếu', devSn: 'Quét SN tài sản mới' };
  var params = new URLSearchParams(location.search);
  var MULTI = params.get('m') === '1', seen = {}, codes = [], lastDup = { c: '', t: 0 };
  var qr = null, done = false, torchOn = false, cams = [], camIdx = -1;
  var $ = function(id) { return document.getElementById(id); };
  function msg(t, cls) { var m = $('msg'); m.textContent = t; m.className = 'status' + (cls ? ' ' + cls : ''); }
  $('title').textContent = TITLES[params.get('t')] || 'Quét mã';

  function formats() {
    var F = Html5QrcodeSupportedFormats;
    return [F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.DATA_MATRIX, F.PDF_417];
  }

  // Tiếng bíp khi quét được mã (iPhone cần chạm màn hình 1 lần mới phát được âm thanh)
  var AC = null;
  function audio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return AC; }
  function beep() {
    var a = audio(); if (!a) return;
    try {
      if (a.state !== 'running') a.resume();
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = 'square'; o.frequency.value = 2200;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.1);
    } catch (e) {}
  }
  function unlockSound() { var a = audio(); if (a && a.state !== 'running') a.resume().then(function() { $('btnSnd').hidden = true; }).catch(function() {}); else $('btnSnd').hidden = true; }
  ['touchstart', 'pointerdown'].forEach(function(ev) { document.addEventListener(ev, unlockSound, { passive: true }); });

  // Gửi mã về app qua cửa sổ đã mở trang này, app trả lời "đã nhận" thì đóng tab ngay (không phải mở lại địa chỉ app).
  // Không có trả lời trong ~1 giây thì gửi qua máy chủ như cũ.
  function sendViaOpener(list) {
    return new Promise(function(res) {
      var op = null; try { op = window.opener && !window.opener.closed ? window.opener : null; } catch (e) {}
      if (!op) return res(false);
      var id = 'b' + Date.now(), t = setTimeout(function() { window.removeEventListener('message', on); res(false); }, 1000);
      function on(ev) { if (ev.data && ev.data.type === 'QR_ACK' && ev.data.id === id) { clearTimeout(t); window.removeEventListener('message', on); res(true); } }
      window.addEventListener('message', on);
      try { op.postMessage({ type: 'QR_BATCH', id: id, codes: list }, '*'); } catch (e) { clearTimeout(t); window.removeEventListener('message', on); res(false); }
    });
  }
  function closeTab(note) {
    try { window.close(); } catch (e) {}
    setTimeout(function() { msg(note || 'Đã gửi. Đóng tab này để quay lại ứng dụng.', 'ok'); }, 400);
  }
  function sendBack(list) {
    var K = params.get('k'), BACK = params.get('back');
    return stop().then(function() { return sendViaOpener(list); }).then(function(ok) {
      if (ok) { closeTab(); return; }
      if (K && BACK && /^https:\/\/script\.google\.com\//.test(BACK)) {
        // replace: không để lại trang quét trong lịch sử, trình duyệt mới cho tự đóng tab
        location.replace(BACK + (BACK.indexOf('?') < 0 ? '?' : '&') + 'scanKey=' + encodeURIComponent(K) + '&code=' + encodeURIComponent(list.join(',')));
        return;
      }
      $('result').textContent = list.join(', ');
      msg('Không gửi tự động được. Sao chép mã rồi dán vào ô quét.', 'bad'); $('btnCopy').hidden = false;
    });
  }

  // Quét liên tục: camera mở suốt, mỗi mã mới bíp 1 tiếng và vào danh sách; bấm Xong gửi cả danh sách về ứng dụng
  function onMulti(code) {
    var now = Date.now();
    if (seen[code]) {
      if (lastDup.c !== code || now - lastDup.t > 2500) { lastDup = { c: code, t: now }; msg(code + ' đã quét rồi'); }
      return;
    }
    seen[code] = true; codes.unshift(code);
    beep();
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    var f = $('frame'); f.classList.add('done'); setTimeout(function() { f.classList.remove('done'); }, 350);
    msg('Đã quét ' + code, 'ok');
    // Máy tính (cửa sổ bật lên): gửi luôn từng mã. Điện thoại: gửi cả danh sách khi bấm Xong
    try { if (window.opener && !window.opener.closed) window.opener.postMessage({ type: 'QR_SCANNED', code: code }, '*'); } catch (e) {}
    renderMulti();
  }
  function renderMulti() {
    $('cnt').textContent = codes.length;
    $('mlist').innerHTML = codes.map(function(c) { return '<span>' + c.replace(/[&<>]/g, '') + '</span>'; }).join('');
    $('btnDone').disabled = !codes.length;
    $('btnDone').textContent = codes.length ? 'Xong · gửi ' + codes.length + ' mã' : 'Xong';
  }
  function finishMulti() {
    if (!codes.length) { stop().then(function() { window.close(); }); return; }
    var list = codes.slice().reverse();
    $('btnDone').disabled = true;
    msg('Đang gửi ' + list.length + ' mã về ứng dụng...', 'ok');
    sendBack(list);
  }
  if (MULTI) {
    document.body.classList.add('multi'); $('mbox').hidden = false;
    $('btnDone').onclick = finishMulti;
    $('btnSnd').onclick = unlockSound;
    setTimeout(function() { var a = audio(); if (a && a.state !== 'running') $('btnSnd').hidden = false; }, 600);
  }

  function onCode(text) {
    if (done) return;
    var code = String(text || '').trim().toUpperCase();
    if (!code) return;
    if (MULTI) { onMulti(code); return; }
    done = true;
    beep();
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
    $('frame').classList.add('done');
    $('result').textContent = code;
    msg('Đã quét, đang gửi về ứng dụng...', 'ok');
    sendBack([code]);
  }

  function stop() {
    if (!qr) return Promise.resolve();
    var q = qr; qr = null;
    return q.stop().catch(function() {}).then(function() { try { q.clear(); } catch (e) {} });
  }

  var zoomMax = 1, zoomMin = 1, zoomCur = 1;
  // Xin camera đúng tỉ lệ khung hiển thị -> hình lấp đầy khung, không còn viền đen hai bên
  function stageAR() {
    var st = document.querySelector('.stage');
    var w = st ? st.clientWidth : 0, h = st ? st.clientHeight : 0;
    return (w > 0 && h > 0) ? Math.round(w / h * 1000) / 1000 : 0.75;
  }
  function startWith(cameraId, lite) {
    zoomCur = 1; $('btnZoom').hidden = true; $('btnZoom').textContent = '1x';
    qr = new Html5Qrcode('reader', { verbose: false, useBarCodeDetectorIfSupported: true, formatsToSupport: formats() });
    return qr.start(
      cameraId || { facingMode: 'environment' },
      { fps: lite ? 10 : 20, disableFlip: true,
        qrbox: function(w, h) {
          var bw = Math.floor(w * 0.92), bh = Math.floor(Math.min(h * 0.75, w * 0.62));
          var f = $('frame'); f.style.width = bw + 'px'; f.style.height = bh + 'px'; f.style.setProperty('--fh', bh + 'px');
          return { width: bw, height: bh };
        },
        videoConstraints: cameraId ? { deviceId: { exact: cameraId }, aspectRatio: { ideal: stageAR() } }
          : (lite ? { facingMode: 'environment', aspectRatio: { ideal: stageAR() } }
                  : { facingMode: 'environment', aspectRatio: { ideal: stageAR() }, width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] }) },
      onCode, function() {}
    ).then(function() {
      msg(MULTI ? 'Đưa lần lượt từng mã vào khung' : 'Đưa mã vào khung, giữ máy thẳng');
      ensureBack();
      try {
        var caps = qr.getRunningTrackCameraCapabilities();
        if (caps && caps.torchFeature && caps.torchFeature().isSupported()) $('btnTorch').hidden = false;
      } catch (e) {}
      try {
        var track = qr.getRunningTrackCapabilities ? qr.getRunningTrackCapabilities() : null;
        if (track && track.focusMode && track.focusMode.indexOf('continuous') >= 0) qr.applyVideoConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function() {});
        if (track && track.zoom && track.zoom.max > 1.2) {
          zoomMax = Math.min(track.zoom.max, 4); zoomMin = track.zoom.min || 1;
          $('btnZoom').hidden = false;
        }
      } catch (e) {}
    });
  }

  function explain(err) {
    var s = String((err && err.message) || err);
    if (/NotAllowed|Permission/i.test(s)) return 'Chưa có quyền camera. Bấm ổ khóa cạnh thanh địa chỉ, chọn Camera → Allow rồi tải lại.';
    if (/NotReadable|Could not start video source|TrackStart/i.test(s)) return 'Camera đang bị app khác giữ hoặc máy không cho trình duyệt dùng. Đóng app Camera, các tab Chrome khác đang dùng camera (kể cả cửa sổ chụp ảnh), tắt đầu quét / DataWedge dùng camera, rồi mở lại.';
    if (/NotFound|Requested device/i.test(s)) return 'Thiết bị không có camera.';
    return 'Không mở được camera: ' + s;
  }

  // Máy PDA nhiều khi không báo facingMode, trình duyệt mở camera trước. Xếp camera sau (nhãn back/rear/environment/sau) lên đầu, camera trước (front/user/trước) xuống cuối.
  function isFront(c) { return /front|user|selfie|trước|truoc/i.test(String(c.label || '')); }
  function isBack(c) { return /back|rear|environment|world|sau/i.test(String(c.label || '')) && !isFront(c); }
  function orderCams(list) {
    var a = (list || []).slice();
    var rank = function(c) { return isBack(c) ? 0 : (isFront(c) ? 2 : 1); };
    return a.map(function(c, i) { return { c: c, i: i }; }).sort(function(x, y) { return rank(x.c) - rank(y.c) || x.i - y.i; }).map(function(o) { return o.c; });
  }
  // Mở xong mà vẫn là camera trước thì đổi sang camera sau (nếu có)
  function ensureBack() {
    try {
      var st = qr && qr.getRunningTrackSettings ? qr.getRunningTrackSettings() : null;
      if (st && st.facingMode === 'user' && !ensureBack.done) {
        ensureBack.done = true;
        Html5Qrcode.getCameras().then(function(list) {
          var ord = orderCams(list);
          if (ord.length > 1 && !isFront(ord[0])) { cams = ord; camIdx = 0; stop().then(function() { return startWith(cams[0].id, true); }).catch(function(e) { msg(explain(e), 'bad'); }); }
        }).catch(function() {});
      }
    } catch (e) {}
  }

  function init() {
    // Máy PDA / điện thoại yếu hay lỗi "Could not start video source" khi xin độ phân giải cao:
    // thử lần lượt: cấu hình đầy đủ -> cấu hình nhẹ (không ép độ phân giải) -> từng camera trong máy
    function tryEachCamera() {
      return Html5Qrcode.getCameras().then(function(list) {
        cams = orderCams(list);
        var p = Promise.reject(new Error('NotFound'));
        cams.forEach(function(c, i) {
          p = p.catch(function() { return stop().then(function() { camIdx = i; return startWith(c.id, true); }); });
        });
        return p;
      });
    }
    startWith(null, false)
      .catch(function() { return stop().then(function() { return startWith(null, true); }); })
      .catch(function() { return stop().then(tryEachCamera); })
      .catch(function(err) { msg(explain(err), 'bad'); $('frame').style.display = 'none'; });
    Html5Qrcode.getCameras().then(function(list) {
      if (list && list.length > 1) { cams = orderCams(list); camIdx = 0; $('btnFlip').hidden = false; }
    }).catch(function() {});
  }

  $('btnZoom').onclick = function() {
    var steps = [1, 2, 3, 4].filter(function(v) { return v >= zoomMin && v <= zoomMax; });
    var i = steps.indexOf(zoomCur); zoomCur = steps[(i + 1) % steps.length] || 1;
    try { qr.applyVideoConstraints({ advanced: [{ zoom: zoomCur }] }); } catch (e) {}
    $('btnZoom').textContent = zoomCur + 'x';
  };
  // Đóng khi đã quét được mã: vẫn gửi danh sách về, không bỏ mã nào
  $('btnClose').onclick = function() { if (MULTI && codes.length) { finishMulti(); return; } stop().then(function() { window.close(); }); };
  $('btnTorch').onclick = function() {
    try {
      var t = qr.getRunningTrackCameraCapabilities().torchFeature();
      torchOn = !torchOn; t.apply(torchOn);
      $('btnTorch').classList.toggle('on', torchOn);
    } catch (e) {}
  };
  // Đổi camera: bỏ qua camera cho hình đen (máy PDA có camera phụ/hồng ngoại/độ sâu, bấm vào chỉ thấy màn đen)
  var blackCams = {};
  function frameIsBlack() {
    try {
      var v = document.querySelector('#reader video');
      if (!v || !v.videoWidth) return true;
      var c = document.createElement('canvas'); c.width = 24; c.height = 24;
      var x = c.getContext('2d'); x.drawImage(v, 0, 0, 24, 24);
      var d = x.getImageData(0, 0, 24, 24).data, sum = 0, n = 0;
      for (var i = 0; i < d.length; i += 4) { sum += d[i] + d[i + 1] + d[i + 2]; n += 3; }
      return (sum / n) < 6;
    } catch (e) { return false; }
  }
  function flipTo(tries) {
    if (!cams.length || tries >= cams.length) { msg('Không có camera nào khác dùng được.', 'bad'); return Promise.resolve(); }
    do { camIdx = (camIdx + 1) % cams.length; } while (blackCams[cams[camIdx].id] && ++tries < cams.length);
    var id = cams[camIdx].id;
    torchOn = false; $('btnTorch').classList.remove('on'); $('btnTorch').hidden = true;
    return stop().then(function() { return startWith(id, true); }).then(function() {
      return new Promise(function(res) { setTimeout(res, 1100); });
    }).then(function() {
      if (qr && frameIsBlack()) { blackCams[id] = true; return flipTo(tries + 1); }
    }).catch(function(e) { blackCams[id] = true; if (tries + 1 < cams.length) return stop().then(function() { return flipTo(tries + 1); }); msg(explain(e), 'bad'); });
  }
  $('btnFlip').onclick = function() { flipTo(0); };
  $('btnCopy').onclick = function() {
    var v = $('result').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(function() { msg('Đã sao chép ' + v, 'ok'); });
  };

  (function load(i) {
    if (window.Html5Qrcode) return init();
    if (i >= LIBS.length) { msg('Không tải được bộ quét (mạng chặn).', 'bad'); return; }
    var s = document.createElement('script'); s.src = LIBS[i];
    s.onload = function() { window.Html5Qrcode ? init() : load(i + 1); };
    s.onerror = function() { load(i + 1); };
    document.head.appendChild(s);
  })(0);
</script>
